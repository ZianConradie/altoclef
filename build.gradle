plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

base {
    archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven {
        name = "MarvionKiritoRepo"
        url = "https://marvionkirito.github.io/maven/"
    }
    maven {
        name = 'babbaj-repo'
        url = 'https://babbaj.github.io/maven/'
    }
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    //to change the versions see the gradle.properties file
    // NOTE: Minecraft 26.3 ships unobfuscated (Mojang official names in the jar),
    // so there is deliberately no `mappings(...)` line here.
    minecraft("com.mojang:minecraft:${project.minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${project.loader_version}")

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    // Jackson JSON
    implementation 'com.fasterxml.jackson.core:jackson-core:2.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    // Nether pathfinder (also nested inside the Baritone jar, same version)
    implementation 'dev.babbaj:nether-pathfinder:1.6'

    // Bundle Jackson into the final jar (replaces the old `shadow` plugin setup).
    include 'com.fasterxml.jackson.core:jackson-core:2.17.2'
    include 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'
    include 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    // Baritone, in Minecraft 26.3 / Mojang official names.
    // With no mappings line there is no remapping step, so mods are plain `implementation`
    // (this matches fabric-example-mod@26.3, which declares fabric-api the same way).
    implementation ":baritone-marvion-26.3"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand(version: project.version)
    }
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from "LICENSE"
    // Nested (jar-in-jar) Baritone, loaded by Fabric from META-INF/jars.
    from("libs/baritone-marvion-26.3.jar") {
        into "META-INF/jars"
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        // uncomment to publish to the local maven
        // mavenLocal()
    }
}
